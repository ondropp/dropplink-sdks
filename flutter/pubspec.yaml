name: dropplink_flutter
description: >-
  Dropplink install attribution, deep linking and in-app events for Flutter. A
  thin bridge to the native Dropplink SDKs for Android and iOS.
repository:
  https://github.com/ondropp/dropplink-sdks/tree/main/flutter
version: 0.2.0
topics:
  - attribution
  - deep-linking
  - app-links
  - universal-links

environment:
  sdk: ">=3.10.0 <4.0.0"
  # 3.38 is the first release with UIScene plugin callbacks (addSceneDelegate).
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: app.ondropp.dropplink.flutter
        pluginClass: DropplinkPlugin
      ios:
        pluginClass: DropplinkPlugin
