name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'contract/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'contract/**', '.github/workflows/android.yml']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      # Tests read the shared fixtures from ../contract, so the whole repo must be checked out.
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Caches Gradle and validates the committed wrapper jar. The runner image ships the Android SDK
      # (ANDROID_HOME), so no local.properties is needed.
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and lint
        run: ./gradlew :dropplink:testDebugUnitTest :dropplink:lint --stacktrace
      - name: Build sample app
        run: ./gradlew :sample:assembleDebug
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/dropplink/build/reports/
            android/dropplink/build/test-results/
