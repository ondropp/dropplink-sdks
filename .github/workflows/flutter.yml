name: Flutter

on:
  push:
    branches: [main]
    paths: ['flutter/**', 'contract/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['flutter/**', 'contract/**', '.github/workflows/flutter.yml']

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib
      - name: Analyze
        run: flutter analyze
      - name: Test
        # Tests read the shared fixtures from ../contract, so the whole repo must be checked out.
        run: flutter test
