[versions]
agp = "8.7.3"
kotlin = "2.0.21"
installreferrer = "2.2"
junit = "4.13.2"
# org.json is built into Android; plain JVM unit tests need the real implementation.
orgJson = "20240303"

[libraries]
installreferrer = { module = "com.android.installreferrer:installreferrer", version.ref = "installreferrer" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
